<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AX 프로젝트 강의 및 교안</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef1f8;
    --surface: #ffffff;
    --surface-muted: #f4f6fb;
    --surface-sunken: #eef1f8;
    --text: #1c2130;
    --text-muted: #6b7280;
    --text-faint: #9aa1b1;
    --border: #e4e8f1;
    --border-strong: #d5dbe8;
    --accent: #4f6df5;
    --accent-soft: #eaefff;
    --accent-text: #3a56d4;
    --green: #1fa971;
    --green-soft: #e5f7ee;
    --red: #ef4b4b;
    --red-soft: #fdecec;
    --amber: #c98a1a;
    --amber-soft: #fbf0dd;
    --purple: #7c4fd6;
    --purple-soft: #f1e9ff;
    --ai: #0f9488;
    --ai-soft: #e3f7f3;
    --shadow: 0 1px 2px rgba(24, 30, 51, 0.03), 0 1px 10px rgba(24, 30, 51, 0.03);
    --radius-lg: 16px;
    --radius-md: 12px;
    --radius-sm: 8px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Sans KR", "Pretendard", -apple-system, "Malgun Gothic", sans-serif;
    font-feature-settings: "tnum" 1;
    -webkit-font-smoothing: antialiased;
    padding: 28px 20px 60px;
  }

  a { color: inherit; text-decoration: none; }

  .wrap {
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  /* Navigation & Breadcrumb */
  .nav-links { display: flex; gap: 16px; flex-wrap: wrap; }
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12.5px;
    color: var(--text-muted);
    width: fit-content;
    background: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    padding: 0;
  }
  .back-link:hover { color: var(--accent-text); }

  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .page-head-text { display: flex; flex-direction: column; gap: 6px; }
  .breadcrumb { font-size: 12.5px; color: var(--text-faint); font-weight: 600; }
  .title-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  h1.page-title {
    font-size: 21px;
    font-weight: 800;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .page-sub { font-size: 13px; color: var(--text-muted); }

  /* Badges */
  .badge {
    font-size: 11.5px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 20px;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .badge.video-ok { background: var(--green-soft); color: var(--green); }
  .badge.video-wait { background: var(--amber-soft); color: var(--amber); }
  .badge.video-plan { background: var(--surface-sunken); color: var(--text-muted); }
  .badge.mat-count { background: var(--accent-soft); color: var(--accent-text); }

  /* Summary Banner */
  .summary-banner {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow);
    padding: 14px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .summary-info { display: flex; align-items: center; gap: 12px; }
  .course-tag {
    background: var(--accent-soft);
    color: var(--accent-text);
    font-weight: 700;
    font-size: 12px;
    padding: 4px 8px;
    border-radius: 6px;
  }
  .course-name { font-size: 14px; font-weight: 700; color: var(--text); }
  .course-meta { font-size: 12.5px; color: var(--text-muted); }

  .filter-group { display: flex; gap: 6px; align-items: center; }
  .filter-btn {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    font-size: 12.5px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .filter-btn:hover { background: var(--surface-muted); color: var(--text); }
  .filter-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  /* Main Split Layout: Player (Left) + Playlist (Right) */
  .lecture-layout {
    display: grid;
    grid-template-columns: 1fr 360px;
    gap: 18px;
    align-items: start;
  }
  @media (max-width: 960px) {
    .lecture-layout { grid-template-columns: 1fr; }
  }

  /* Left Panel */
  .main-panel {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    padding: 20px 22px;
  }

  /* Video Section */
  .player-box {
    background: #000;
    border-radius: var(--radius-md);
    overflow: hidden;
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
  }
  .player-box iframe {
    width: 100%;
    height: 100%;
    border: none;
  }
  .player-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #182230 0%, #0d1520 100%);
    color: #fff;
    text-align: center;
    padding: 24px;
    gap: 12px;
  }
  .placeholder-icon {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--amber);
  }
  .placeholder-title { font-size: 16px; font-weight: 700; margin: 0; }
  .placeholder-desc { font-size: 13px; color: #a1adbf; margin: 0; max-width: 380px; line-height: 1.5; }

  /* Current Lesson Details */
  .lesson-header {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 14px;
  }
  .lesson-meta-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    font-size: 12.5px;
    color: var(--text-muted);
  }
  .lesson-title-lg {
    font-size: 18px;
    font-weight: 800;
    margin: 0;
    color: var(--text);
    line-height: 1.4;
  }
  
  .lesson-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 6px;
    flex-wrap: wrap;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all 0.15s ease;
    font-family: inherit;
  }
  .btn-outline {
    background: var(--surface);
    border-color: var(--border-strong);
    color: var(--text);
  }
  .btn-outline:hover {
    background: var(--surface-muted);
    border-color: var(--accent);
    color: var(--accent-text);
  }
  .btn-primary {
    background: var(--accent);
    color: #fff;
  }
  .btn-primary:hover { background: var(--accent-text); }

  /* Material Section */
  .section-title {
    font-size: 14.5px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0 0 12px 0;
    color: var(--text);
  }
  .material-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .material-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    background: var(--surface-muted);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    gap: 12px;
    transition: border-color 0.15s;
  }
  .material-item:hover { border-color: var(--accent); }
  .material-left {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }
  .material-icon {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: var(--accent-soft);
    color: var(--accent-text);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .material-icon.link {
    background: var(--purple-soft);
    color: var(--purple);
  }
  .material-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }
  .material-name {
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .material-meta {
    font-size: 11.5px;
    color: var(--text-muted);
  }
  .material-btn {
    font-size: 12px;
    font-weight: 600;
    padding: 5px 10px;
    border-radius: 6px;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    color: var(--text);
    white-space: nowrap;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .material-btn:hover {
    background: var(--accent-soft);
    color: var(--accent-text);
    border-color: var(--accent);
  }

  /* Right Playlist Panel */
  .playlist-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .playlist-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }
  .playlist-title {
    font-size: 14.5px;
    font-weight: 700;
    margin: 0;
  }
  .playlist-count {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 600;
  }

  .playlist-items {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 640px;
    overflow-y: auto;
    padding-right: 4px;
  }
  .playlist-items::-webkit-scrollbar { width: 5px; }
  .playlist-items::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }

  .playlist-item {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 12px 14px;
    background: var(--surface-muted);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .playlist-item:hover {
    background: #edf3ff;
    border-color: var(--accent);
  }
  .playlist-item.active {
    background: var(--accent-soft);
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent);
  }
  .playlist-item-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .playlist-item-order {
    font-size: 11.5px;
    font-weight: 700;
    color: var(--accent-text);
  }
  .playlist-item.active .playlist-item-order {
    color: var(--accent-text);
  }
  .playlist-item-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.4;
  }
  .playlist-item-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11.5px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  /* Toast Notification */
  .toast {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #182230;
    color: #fff;
    padding: 12px 20px;
    border-radius: 30px;
    font-size: 13.5px;
    font-weight: 600;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    display: flex;
    align-items: center;
    gap: 8px;
    z-index: 1000;
    opacity: 0;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    pointer-events: none;
  }
  .toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }
</style>
</head>

      title: "실전 과제 평가 자동화 파이프라인 설계 및 보안",
      date: "2026-08-27",
      blogUrl: "https://blog.example.com/eval-pipeline",
      videoUrl: null,
      hasVideo: false,
      statusNote: "수업 종료 후 다시보기 영상이 업로드될 예정입니다.",
      materials: [
        { kind: "FILE", title: "06_eval_pipeline_security.pdf", size: "9.5 MB", url: "#" },
        { kind: "LINK", title: "LLM Security Checklist (OWASP Top 10)", url: "https://owasp.org" }
      ]
    },
    {
      id: 7,
      order: 7,
      title: "AX 프로젝트 중간 점검 및 코드 리뷰 실습",
      date: "2026-08-30",
      blogUrl: null,
      videoUrl: null,
      hasVideo: false,
      statusNote: "수업 예정 차시입니다.",
      materials: [
        { kind: "FILE", title: "07_code_review_rubric.pdf", size: "4.2 MB", url: "#" }
      ]
    },
    {
      id: 8,
      order: 8,
      title: "최종 프로젝트 발표 및 성과 분석 회고",
      date: "2026-09-03",
      blogUrl: null,
      videoUrl: null,
      hasVideo: false,
      statusNote: "수업 예정 차시입니다.",
      materials: []
    }
  ];

  let currentLessonId = 4; // default selected
  let currentFilter = 'all';

  function renderPlaylist() {
    const container = document.getElementById('playlist-container');
    container.innerHTML = '';

    const filtered = lessonsData.filter(item => {
      if (currentFilter === 'video') return item.hasVideo;
      if (currentFilter === 'material') return item.materials && item.materials.length > 0;
      return true;
    });

    document.getElementById('list-total-count').textContent = `총 ${filtered.length}개 차시`;

    if (filtered.length === 0) {
      container.innerHTML = '<div style="text-align:center; padding: 30px 10px; font-size:13px; color:var(--text-muted);">해당 조건의 차시가 없습니다.</div>';
      return;
    }

    filtered.forEach(lesson => {
      const itemEl = document.createElement('div');
      itemEl.className = `playlist-item ${lesson.id === currentLessonId ? 'active' : ''}`;
      itemEl.onclick = () => selectLesson(lesson.id);

      let videoBadgeHtml = '';
      if (lesson.hasVideo) {
        videoBadgeHtml = '<span class="badge video-ok">영상 O</span>';
      } else if (lesson.order <= 6) {
        videoBadgeHtml = '<span class="badge video-wait">영상 준비중</span>';
      } else {
        videoBadgeHtml = '<span class="badge video-plan">수업 예정</span>';
      }

      itemEl.innerHTML = `
        <div class="playlist-item-top">
          <span class="playlist-item-order">${lesson.order}회차</span>
          ${videoBadgeHtml}
        </div>
        <div class="playlist-item-title">${lesson.title}</div>
        <div class="playlist-item-meta">
          <span>${lesson.date}</span>
          <span>교안 ${lesson.materials.length}건</span>
        </div>
      `;
      container.appendChild(itemEl);
    });
  }

  function selectLesson(id) {
    currentLessonId = id;
    const lesson = lessonsData.find(l => l.id === id);
    if (!lesson) return;

    // Update Player
    const playerContainer = document.getElementById('player-container');
    if (lesson.hasVideo && lesson.videoUrl) {
      playerContainer.innerHTML = `
        <iframe src="${lesson.videoUrl}" title="${lesson.title}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
      `;
    } else {
      playerContainer.innerHTML = `
        <div class="player-placeholder">
          <div class="placeholder-icon">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect><line x1="7" y1="2" x2="7" y2="22"></line><line x1="17" y1="2" x2="17" y2="22"></line><line x1="2" y1="12" x2="22" y2="12"></line><line x1="2" y1="7" x2="7" y2="7"></line><line x1="2" y1="17" x2="7" y2="17"></line><line x1="17" y1="17" x2="22" y2="17"></line><line x1="17" y1="7" x2="22" y2="7"></line></svg>
          </div>
          <h4 class="placeholder-title">${lesson.order}회차 강의 영상 준비중</h4>
          <p class="placeholder-desc">${lesson.statusNote || '수업 종료 후 다시보기 영상 링크가 이 곳에 업로드됩니다.'}</p>
        </div>
      `;
    }

    // Update Details
    document.getElementById('cur-order-badge').textContent = `${lesson.order}회차`;
    document.getElementById('cur-date').textContent = lesson.date;
    document.getElementById('cur-title').textContent = lesson.title;

    const statusBadge = document.getElementById('cur-status-badge');
    if (lesson.hasVideo) {
      statusBadge.className = 'badge video-ok';
      statusBadge.textContent = '영상 시청 가능';
    } else if (lesson.order <= 6) {
      statusBadge.className = 'badge video-wait';
      statusBadge.textContent = '영상 준비중';
    } else {
      statusBadge.className = 'badge video-plan';
      statusBadge.textContent = '수업 예정';
    }

    // Blog Button
    const blogBtn = document.getElementById('cur-blog-btn');
    if (lesson.blogUrl) {
      blogBtn.href = lesson.blogUrl;
      blogBtn.style.display = 'inline-flex';
    } else {
      blogBtn.style.display = 'none';
    }

    // Materials List
    const matCountEl = document.getElementById('material-count');
    const matListContainer = document.getElementById('material-list-container');
    matCountEl.textContent = lesson.materials.length;
    matListContainer.innerHTML = '';

    if (lesson.materials.length === 0) {
      matListContainer.innerHTML = '<div style="padding: 16px; text-align: center; color: var(--text-muted); font-size: 13px;">등록된 교안 자료가 없습니다.</div>';
    } else {
      lesson.materials.forEach(mat => {
        const isFile = mat.kind === 'FILE';
        const item = document.createElement('div');
        item.className = 'material-item';
        item.innerHTML = `
          <div class="material-left">
            <div class="material-icon ${isFile ? '' : 'link'}">
              ${isFile 
                ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>'
                : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>'
              }
            </div>
            <div class="material-info">
              <div class="material-name">${mat.title}</div>
              <div class="material-meta">${isFile ? `파일 첨부 · ${mat.size}` : '외부 참고 링크'}</div>
            </div>
          </div>
          ${isFile 
            ? `<button class="material-btn" onclick="showToast('${mat.title} 다운로드를 시작합니다.')"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg> 다운로드</button>`
            : `<a href="${mat.url}" target="_blank" class="material-btn"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg> 링크 열기</a>`
          }
        `;
        matListContainer.appendChild(item);
      });
    }

    renderPlaylist();
  }

  function filterLessons(filterType, btn) {
    currentFilter = filterType;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderPlaylist();
  }

  function showToast(msg) {
    const toast = document.getElementById('toast');
    document.getElementById('toast-msg').textContent = msg;
    toast.classList.add('show');
    setTimeout(() => {
      toast.classList.remove('show');
    }, 2400);
  }

  // Initial load
  selectLesson(currentLessonId);
</script>

</body>
</html>
