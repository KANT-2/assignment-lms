{% comment %} 유튜브 영상 링크 빠른 등록 모달 — lecture_manage.html 에서 include {% endcomment %}
<div id="quick-video-modal" class="modal-backdrop" onclick="handleBackdropClick(event, 'quick-video-modal')">
  <div class="modal-box" style="max-width: 520px;">
    <div class="modal-head">
      <h3 class="modal-title">유튜브 영상 링크 빠른 등록</h3>
      <button class="modal-close" onclick="closeModal('quick-video-modal')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="quick-lesson-id">
      <div id="quick-lesson-target" style="font-size: 13.5px; font-weight: 700; color: var(--accent-text); margin-bottom: 4px;"></div>

      <div class="form-group">
        <label class="form-label">유튜브 다시보기 링크<span class="req">*</span></label>
        <input type="url" id="quick-video-input" class="form-control" placeholder="https://www.youtube.com/watch?v=..." oninput="updateQuickPreview()">
        <span class="form-hint">저장 즉시 썸네일과 영상이 생성되어 학생 화면에 노출됩니다.</span>
      </div>

      <div id="quick-video-preview" class="video-preview-wrap">
        <div class="thumb-info-bar">
          <span class="thumb-info-badge">자동 추출 썸네일</span>
          <span id="quick-video-id" style="color:var(--text-muted); font-size:11px;"></span>
        </div>
        <div class="preview-box" style="width: 100%; aspect-ratio: 16/9;">
          <img id="quick-thumb-preview" src="" alt="썸네일" style="width:100%; height:100%; object-fit:cover;">
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-outline" onclick="closeModal('quick-video-modal')">취소</button>
      <button class="btn btn-primary" onclick="saveQuickVideo()">영상 링크 저장</button>
    </div>
  </div>
</div>
