<div class="card">
  <div class="card-head">
    <div class="card-title">과제 제출 현황</div>
  </div>
  <div class="submission-status">
    <div class="submission-ring" style="--submission-pct:{{ submission_week.pct }}%" role="img" aria-label="과제 제출률 {{ submission_week.pct }}퍼센트">
      <div class="submission-ring-label">제출률<strong>{{ submission_week.pct }}%</strong></div>
    </div>
    <div class="submission-summary">
      <div class="submission-stat"><span>전체 과제</span><strong>{{ submission_week.total }}개</strong></div>
      <div class="submission-stat"><span>제출 완료</span><strong>{{ submission_week.submitted }}개</strong></div>
      <div class="submission-stat"><span>채점 전</span><strong>{{ submission_week.ungraded }}개</strong></div>
    </div>
  </div>
  <nav class="submission-week-nav" aria-label="과제 제출 현황 주간 이동">
    <a href="{{ submission_week.prev_url }}" aria-label="이전 주">‹</a>
    <span>{{ submission_week.start|date:"Y.m.d (D)" }} - {{ submission_week.end|date:"Y.m.d (D)" }}</span>
    <a href="{{ submission_week.next_url }}" aria-label="다음 주">›</a>
  </nav>
</div>
